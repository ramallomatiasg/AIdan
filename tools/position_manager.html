<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIdan — Position Manager</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
    --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149;
    --amber: #d29922; --violet: #bc8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .chip { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); }
  .chip.mode-log { background: rgba(210,153,34,.15); color: var(--amber); }
  .chip.mode-active { background: rgba(63,185,80,.15); color: var(--green); }
  .chip.mode-off { background: rgba(139,148,158,.15); color: var(--muted); }
  .chip.llm-on { background: rgba(188,140,255,.15); color: var(--violet); }
  .wrap { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; }
  .stat .v { font-size: 24px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; margin-top: 4px; }
  h2 { font-size: 15px; margin: 24px 0 10px; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border);
    font-size: 13px; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .act-HOLD { color: var(--muted); }
  .act-CLOSE_PROFIT { color: var(--green); font-weight: 600; }
  .act-CLOSE_PROTECT { color: var(--amber); font-weight: 600; }
  .act-CLOSE_MAXHOLD { color: var(--accent); font-weight: 600; }
  .act-CLOSE_LLM { color: var(--violet); font-weight: 600; }
  .src { font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .reason { color: var(--muted); font-size: 12px; max-width: 380px; }
  .refresh { margin-left: auto; color: var(--muted); font-size: 12px; }
  button { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>🎛️ Position Manager</h1>
  <span id="modeChip" class="chip mode-log">mode: …</span>
  <span id="llmChip" class="chip">llm: …</span>
  <span class="refresh" id="refreshInfo">cargando…</span>
  <button onclick="loadAll()">↻ Refrescar</button>
</header>
<div class="wrap">
  <div class="grid" id="statsGrid"></div>

  <h2>Posiciones abiertas</h2>
  <div id="openWrap"><div class="empty">…</div></div>

  <h2>Decisiones de cierre recientes</h2>
  <div id="closesWrap"><div class="empty">…</div></div>
</div>

<script>
const fmtPips = v => (v == null ? '—' : (v >= 0 ? '+' : '') + Number(v).toFixed(1) + 'p');
const cls = v => v == null ? '' : (v >= 0 ? 'pos' : 'neg');
const esc = s => (s == null ? '' : String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])));

async function loadAll() {
  try {
    const [stateR, statsR] = await Promise.all([
      fetch('/position-manager/state').then(r => r.json()),
      fetch('/position-manager/stats').then(r => r.json()),
    ]);
    renderState(stateR);
    renderStats(statsR);
    document.getElementById('refreshInfo').textContent = 'actualizado ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('refreshInfo').textContent = 'error: ' + e;
  }
}

function renderState(s) {
  const mc = document.getElementById('modeChip');
  mc.textContent = 'mode: ' + (s.mode || '?');
  mc.className = 'chip mode-' + (s.mode || 'off');
  const lc = document.getElementById('llmChip');
  lc.textContent = 'llm: ' + (s.llm_enabled ? 'ON' : 'off');
  lc.className = 'chip ' + (s.llm_enabled ? 'llm-on' : 'mode-off');

  const pos = s.open_positions || [];
  if (!pos.length) {
    document.getElementById('openWrap').innerHTML = '<div class="empty">No hay posiciones abiertas ahora.</div>';
    return;
  }
  let h = '<table><tr><th>#</th><th>Dir</th><th>Trigger</th><th>Ticket</th><th>Última decisión</th><th>P&L</th><th>HWM</th><th>%TP</th><th>Min</th><th>Razón</th></tr>';
  for (const p of pos) {
    const d = p.last_decision;
    h += `<tr>
      <td>${p.id}</td><td>${esc(p.direction)}</td><td>${esc(p.trigger_type||'')}</td>
      <td>${p.mt5_ticket||''}</td>
      <td class="act-${d?d.action:''}">${d?esc(d.action):'—'} <span class="src">${d?esc(d.decision_source):''}</span></td>
      <td class="${d?cls(d.progress_pips):''}">${d?fmtPips(d.progress_pips):'—'}</td>
      <td>${d?fmtPips(d.hwm_pips):'—'}</td>
      <td>${d&&d.tp_pct!=null?(d.tp_pct*100).toFixed(0)+'%':'—'}</td>
      <td>${d&&d.time_in_trade_min!=null?Math.round(d.time_in_trade_min):'—'}</td>
      <td class="reason">${d?esc(d.reason):''}</td>
    </tr>`;
  }
  h += '</table>';
  document.getElementById('openWrap').innerHTML = h;
}

function renderStats(s) {
  const ba = s.by_action || {};
  const g = document.getElementById('statsGrid');
  g.innerHTML = `
    <div class="stat"><div class="v">${s.total_decisions||0}</div><div class="l">decisiones totales</div></div>
    <div class="stat"><div class="v" style="color:var(--green)">${ba.CLOSE_PROFIT||0}</div><div class="l">profit-lock</div></div>
    <div class="stat"><div class="v" style="color:var(--amber)">${ba.CLOSE_PROTECT||0}</div><div class="l">protect (corte)</div></div>
    <div class="stat"><div class="v" style="color:var(--accent)">${ba.CLOSE_MAXHOLD||0}</div><div class="l">max-hold</div></div>
    <div class="stat"><div class="v" style="color:var(--violet)">${ba.CLOSE_LLM||0}</div><div class="l">cierre LLM</div></div>
    <div class="stat"><div class="v">${s.executed_closes||0}</div><div class="l">cierres ejecutados</div></div>
  `;
  const rc = s.recent_close_decisions || [];
  if (!rc.length) {
    document.getElementById('closesWrap').innerHTML = '<div class="empty">Sin decisiones de cierre todavía. (En modo log el gestor registra qué haría sin ejecutar.)</div>';
    return;
  }
  let h = '<table><tr><th>Cuándo</th><th>#</th><th>Acción</th><th>Modo</th><th>Ejec</th><th>P&L</th><th>HWM</th><th>Min</th><th>Razón</th></tr>';
  for (const r of rc) {
    h += `<tr>
      <td>${esc((r.created_at||'').slice(5,16))}</td>
      <td>${r.strategy_id}</td>
      <td class="act-${r.action}">${esc(r.action)} <span class="src">${esc(r.decision_source)}</span></td>
      <td>${esc(r.mode)}</td>
      <td>${r.executed?'✓':'—'}</td>
      <td class="${cls(r.progress_pips)}">${fmtPips(r.progress_pips)}</td>
      <td>${fmtPips(r.hwm_pips)}</td>
      <td>${r.time_in_trade_min!=null?Math.round(r.time_in_trade_min):'—'}</td>
      <td class="reason">${esc(r.reason)}</td>
    </tr>`;
  }
  h += '</table>';
  document.getElementById('closesWrap').innerHTML = h;
}

loadAll();
setInterval(loadAll, 20000);
</script>
</body>
</html>
