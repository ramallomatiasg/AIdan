<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial News Monitor - Dashboard Real</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', 'Courier New', monospace;
            background: #000000;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            font-size: 20px;
            letter-spacing: 1px;
        }

        /* Efecto CRT Scanlines */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.05) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 255, 0, 0.05) 3px
            );
            pointer-events: none;
            z-index: 1000;
            animation: flicker 0.15s infinite;
        }

        /* Efecto de parpadeo sutil */
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.97; }
        }

        /* Glow effect para el texto */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0, 255, 0, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            background: #001100;
            border: 2px solid #00ff00;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 
                0 0 10px rgba(0, 255, 0, 0.5),
                inset 0 0 10px rgba(0, 255, 0, 0.1);
            position: relative;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .subtitle {
            color: #a5b4fc;
            font-size: 1.1rem;
        }

        .api-badge {
            display: inline-block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
            margin-left: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(139, 92, 246, 0.2);
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-color: rgba(139, 92, 246, 0.6);
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #a5b4fc;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .alerts-section {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .section-title {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, #8b5cf6, #ec4899) 1;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .alerts-container {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .alerts-container::-webkit-scrollbar {
            width: 8px;
        }

        .alerts-container::-webkit-scrollbar-track {
            background: rgba(139, 92, 246, 0.1);
            border-radius: 10px;
        }

        .alerts-container::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 10px;
        }

        .alerts-container::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.7);
        }

        .alert-item {
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 16px;
            border-left: 5px solid;
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(139, 92, 246, 0.2);
            position: relative;
            overflow: hidden;
        }

        .alert-item:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: -5px 10px 30px rgba(139, 92, 246, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .alert-item.alta {
            border-left-color: #ef4444;
            background: rgba(127, 29, 29, 0.3);
        }

        .alert-title {
            font-size: 1.5rem;
            color: #00ff00;
            margin-bottom: 15px;
            font-weight: 400;
            line-height: 1.4;
            padding-left: 20px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .alert-detail-section {
            background: #000000;
            border-left: 3px solid #00ff00;
            padding: 15px;
            margin-bottom: 12px;
            color: #00cc00;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-left: 20px;
        }

        .detail-title {
            color: #00ff00;
            font-size: 1.2rem;
            font-weight: 400;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .eur-usd-impact {
            background: #000000;
            border-left: 3px solid #00ff00;
        }

        .market-implications {
            background: #000000;
            border-left: 3px solid #00ff00;
        }

        .alert-time {
            color: #00cc00;
            font-size: 1rem;
            margin-top: 15px;
            padding-left: 20px;
        }

        .alert-link {
            color: #00ff00;
            text-decoration: none;
            font-size: 1rem;
            word-break: break-all;
        }

        .alert-link:hover {
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00ff00;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #001100;
            border-top-color: #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #00cc00;
            font-size: 1.3rem;
        }

        .refresh-btn {
            background: #001100;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: 400;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            transition: all 0.3s;
            margin: 20px auto;
            display: block;
            font-family: 'VT323', 'Courier New', monospace;
            text-transform: uppercase;
        }

        .refresh-btn:hover {
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            background: #002200;
        }

        .refresh-btn:active {
            transform: scale(0.98);
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-item {
            animation: fadeIn 0.6s ease-out;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Financial News Monitor</h1>
            <p class="subtitle">Dashboard en Tiempo Real <span class="status-indicator"></span></p>
            <span class="api-badge">🔴 LIVE - http://localhost:8000</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalNews">--</div>
                <div class="stat-label">Total Noticias</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalAlerts">--</div>
                <div class="stat-label">Alertas Enviadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="newsLastHour">--</div>
                <div class="stat-label">Noticias (Última Hora)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="apiStatus">--</div>
                <div class="stat-label">Estado API</div>
            </div>
        </div>

        <div class="alerts-section">
            <h2 class="section-title">� Señales EUR/USD - Trading Binario (Horario NY)</h2>
            <div id="alertsContainer" class="alerts-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando alertas en tiempo real...</p>
                </div>
            </div>
            <button class="refresh-btn" onclick="refreshData()">🔄 Actualizar Ahora</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                if (!response.ok) throw new Error('Stats API error');
                const data = await response.json();

                if (data.data) {
                    document.getElementById('totalNews').textContent = data.data.total_news.toLocaleString('es-ES');
                    document.getElementById('totalAlerts').textContent = data.data.total_alerts.toLocaleString('es-ES');
                    document.getElementById('newsLastHour').textContent = data.data.news_last_hour;
                    document.getElementById('apiStatus').textContent = '✓ OK';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('apiStatus').textContent = '✗ Error';
            }
        }

        async function loadAlerts() {
            try {
                const response = await fetch(`${API_BASE}/recent-alerts?limit=20`);
                if (!response.ok) throw new Error('Alerts API error');
                const data = await response.json();

                const container = document.getElementById('alertsContainer');
                
                if (!data.data || data.data.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 No hay alertas ALTA aún...</div>';
                    return;
                }

                container.innerHTML = '';
                data.data.forEach((alert, index) => {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = `alert-item alta`;
                    alertDiv.style.animationDelay = `${index * 0.1}s`;

                    // Convertir a hora de Argentina (UTC-3)
                    const date = new Date(alert.sent_at);
                    const argentinaTime = new Date(date.getTime() - (3 * 60 * 60 * 1000));
                    const timeStr = argentinaTime.toLocaleString('es-AR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    });

                    // Extraer breve descripción (primeras 2 líneas del explanation)
                    const explainLines = alert.explanation.split('\n').filter(l => l.trim());
                    const briefDesc = explainLines.slice(0, 2).join(' ').substring(0, 200) + '...';

                    // Determinar color de probabilidad tipo semáforo
                    let probColor = '';
                    let probText = '';
                    let tradingSignal = '';
                    
                    if (alert.eur_usd_impact.includes('MÍNIMO') || alert.eur_usd_impact.includes('BAJA')) {
                        probColor = '#22c55e'; // Verde
                        probText = '🟢 BAJO RIESGO';
                        tradingSignal = '⏸️ NO OPERAR - Esperar señal clara';
                    } else if (alert.eur_usd_impact.includes('MEDIA')) {
                        probColor = '#f59e0b'; // Amarillo
                        probText = '🟡 RIESGO MEDIO';
                        tradingSignal = '⚠️ PRECAUCIÓN - Reducir tamaño de posición';
                    } else if (alert.eur_usd_impact.includes('ALTA')) {
                        probColor = '#ef4444'; // Rojo
                        probText = '🔴 ALTO RIESGO';
                        tradingSignal = '🚨 OPORTUNIDAD - Momento de operar con volatilidad';
                    } else {
                        probColor = '#6366f1';
                        probText = '🔵 ANALIZAR';
                        tradingSignal = '📊 Revisar datos antes de operar';
                    }

                    // Determinar dirección de EUR/USD
                    let direction = '';
                    if (alert.eur_usd_impact.includes('sube') || alert.eur_usd_impact.includes('EUR/USD sube')) {
                        direction = '📈 <strong style="color: #22c55e;">CALL (Compra)</strong> - EUR se fortalece vs USD';
                    } else if (alert.eur_usd_impact.includes('baja') || alert.eur_usd_impact.includes('EUR/USD baja')) {
                        direction = '📉 <strong style="color: #ef4444;">PUT (Venta)</strong> - EUR se debilita vs USD';
                    } else {
                        direction = '↔️ <strong>NEUTRAL</strong> - Sin dirección clara';
                    }

                    alertDiv.innerHTML = `
                        <div class="alert-header">
                            <span class="alert-level alta">IMPACTO ${alert.impact_score}/100</span>
                            <span class="alert-score" style="background: ${probColor};">${probText}</span>
                        </div>
                        
                        <div class="alert-title">${alert.title}</div>
                        
                        <div class="alert-detail-section" style="background: rgba(100, 116, 139, 0.15); border-left-color: #64748b;">
                            <div class="detail-title">📝 Resumen</div>
                            ${briefDesc}
                        </div>
                        
                        <div class="alert-detail-section eur-usd-impact" style="border-left: 4px solid ${probColor}; background: ${probColor}15;">
                            <div class="detail-title" style="color: ${probColor};">💱 SEÑAL EUR/USD</div>
                            <div style="font-size: 1.1rem; margin: 10px 0;">${direction}</div>
                            <div style="margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px;">
                                <strong>${tradingSignal}</strong>
                            </div>
                        </div>
                        
                        <div class="alert-detail-section market-implications">
                            <div class="detail-title">⚡ TRADING BINARIO (1-5 min)</div>
                            <div style="font-size: 1rem; line-height: 1.8;">
                                ${direction}<br>
                                <strong>Volatilidad esperada:</strong> ${alert.impact_score >= 85 ? '🔥 ALTA' : alert.impact_score >= 70 ? '⚡ MEDIA' : '📊 BAJA'}<br>
                                <strong>Timeframe recomendado:</strong> ${alert.impact_score >= 85 ? '1-2 minutos' : '3-5 minutos'}<br>
                                <strong>Ventana de trading:</strong> Próximos 30-60 minutos
                            </div>
                        </div>
                        
                        <div class="alert-time" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>⏰ ${timeStr} (AR)</span>
                            <a href="${alert.url}" target="_blank" class="alert-link" style="font-size: 0.8rem;">📰 Leer noticia completa</a>
                        </div>
                    `;

                    container.appendChild(alertDiv);
                });

            } catch (error) {
                console.error('Error loading alerts:', error);
                const container = document.getElementById('alertsContainer');
                container.innerHTML = `
                    <div class="error-message">
                        <strong>❌ Error conectando a la API</strong><br>
                        ${error.message}<br>
                        <small>Asegúrate de que el Admin API esté corriendo en http://localhost:8000</small>
                    </div>
                `;
            }
        }

        async function refreshData() {
            const btn = document.querySelector('.refresh-btn');
            btn.disabled = true;
            
            await loadStats();
            await loadAlerts();
            
            btn.disabled = false;
        }

        // Load data on page load
        window.addEventListener('DOMContentLoaded', () => {
            refreshData();
            
            // Auto-refresh every 30 seconds
            setInterval(refreshData, 30000);
        });
    </script>
</body>
</html>
