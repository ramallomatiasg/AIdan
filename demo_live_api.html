<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial News Monitor - Live API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at top, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .subtitle {
            color: #a5b4fc;
            font-size: 1.1rem;
        }

        .api-badge {
            display: inline-block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #a5b4fc;
            font-size: 1.2rem;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(139, 92, 246, 0.3);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .news-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .news-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.4);
            border-color: rgba(139, 92, 246, 0.6);
        }

        .news-source {
            color: #8b5cf6;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .news-title {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .news-title a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .news-title a:hover {
            color: #8b5cf6;
        }

        .news-description {
            color: #a5b4fc;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .news-time {
            color: #6366f1;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 18px 45px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
            transition: all 0.4s;
            margin: 20px auto;
            display: block;
        }

        .refresh-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(139, 92, 246, 0.6);
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .news-card {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Financial News Monitor</h1>
            <p class="subtitle">Noticias en Tiempo Real desde NewsAPI</p>
            <span class="api-badge">🔴 LIVE API</span>
        </div>

        <div id="loadingContainer" class="loading">
            <div class="spinner"></div>
            <p>Cargando noticias financieras en tiempo real...</p>
        </div>

        <div id="newsContainer" class="news-grid" style="display: none;"></div>
        
        <div id="errorContainer" style="display: none;"></div>

        <button class="refresh-btn" onclick="loadNews()" id="refreshBtn">
            🔄 Actualizar Noticias
        </button>
    </div>

    <script>
        // API Key de NewsAPI (esta es una demo key, obtén la tuya en newsapi.org)
        const API_KEY = 'demo'; // Reemplazar con tu key de https://newsapi.org
        const API_URL = `https://newsapi.org/v2/everything?q=finance OR stocks OR market OR fed OR economy&language=en&sortBy=publishedAt&pageSize=12&apiKey=${API_KEY}`;

        async function loadNews() {
            const newsContainer = document.getElementById('newsContainer');
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            const refreshBtn = document.getElementById('refreshBtn');

            // Show loading
            newsContainer.style.display = 'none';
            loadingContainer.style.display = 'block';
            errorContainer.style.display = 'none';
            refreshBtn.disabled = true;

            try {
                console.log('Fetching news from API...');
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === 'error') {
                    throw new Error(data.message || 'API Error');
                }

                console.log(`Received ${data.articles.length} articles`);
                
                // Clear container
                newsContainer.innerHTML = '';
                
                // Render articles
                data.articles.forEach((article, index) => {
                    const card = createNewsCard(article, index);
                    newsContainer.appendChild(card);
                });

                // Show results
                loadingContainer.style.display = 'none';
                newsContainer.style.display = 'grid';

            } catch (error) {
                console.error('Error loading news:', error);
                
                loadingContainer.style.display = 'none';
                errorContainer.style.display = 'block';
                errorContainer.innerHTML = `
                    <div class="error-message">
                        <h3>❌ Error al cargar noticias</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px; font-size: 0.9rem;">
                            💡 Nota: Necesitas una API key de <a href="https://newsapi.org" target="_blank" style="color: #8b5cf6;">NewsAPI.org</a>
                        </p>
                        <p style="margin-top: 10px; font-size: 0.85rem; color: #a5b4fc;">
                            Para el sistema real con feeds RSS: <code style="background: rgba(139,92,246,0.2); padding: 4px 8px; border-radius: 4px;">python src/collector/main.py</code>
                        </p>
                    </div>
                `;
            } finally {
                refreshBtn.disabled = false;
            }
        }

        function createNewsCard(article, index) {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.style.animationDelay = `${index * 0.1}s`;

            const source = article.source?.name || 'Unknown Source';
            const title = article.title || 'No title';
            const description = article.description || 'No description available';
            const url = article.url || '#';
            const publishedAt = new Date(article.publishedAt).toLocaleString('es-ES', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            card.innerHTML = `
                <div class="news-source">${source}</div>
                <div class="news-title">
                    <a href="${url}" target="_blank" rel="noopener">${title}</a>
                </div>
                <div class="news-description">${description}</div>
                <div class="news-time">🕐 ${publishedAt}</div>
            `;

            return card;
        }

        // Load news on page load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, fetching news...');
            loadNews();
        });

        // Auto refresh every 5 minutes
        setInterval(() => {
            console.log('Auto-refreshing news...');
            loadNews();
        }, 5 * 60 * 1000);
    </script>
</body>
</html>
